# ============================================================
# AIPID 温控系统 - Nginx 生产配置
# 部署路径: /etc/nginx/sites-available/aipid
# 启用: ln -s /etc/nginx/sites-available/aipid /etc/nginx/sites-enabled/
# ============================================================

upstream aipid_backend {
    # Flask 后端（Gunicorn 监听）
    server 127.0.0.1:5000;
    # 多实例时可添加更多:
    # server 127.0.0.1:5001;
    keepalive 32;
}

server {
    listen 80;
    server_name pid.yourcompany.com;  # 替换为实际域名
    return 301 https://$host$request_uri;  # HTTP → HTTPS 重定向
}

server {
    listen 443 ssl http2;
    server_name pid.yourcompany.com;  # 替换为实际域名

    # ---------- SSL 证书（阿里云或 Let's Encrypt） ----------
    ssl_certificate     /etc/ssl/certs/yourdomain.pem;
    ssl_certificate_key /etc/ssl/private/yourdomain.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ---------- 安全头 ----------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ---------- 静态文件（Vue 构建产物） ----------
    root /var/www/aipid/frontend/dist;
    index index.html;

    # Vue 路由 History 模式：所有非 API 路径返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- API 反向代理到 Flask ----------
    location /api/ {
        proxy_pass http://aipid_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # 请求体大小限制
        client_max_body_size 16m;
    }

    # ---------- 静态资源缓存 ----------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---------- 日志 ----------
    access_log /var/log/nginx/aipid_access.log;
    error_log  /var/log/nginx/aipid_error.log;
}
