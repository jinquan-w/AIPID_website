# ============================================================
# AIPID 温控系统 - Nginx 配置（HTTPS 生产环境）
# ============================================================

upstream aipid_backend {
    server backend:5000;
    keepalive 32;
}

# ---------- HTTP → HTTPS 重定向 ----------
server {
    listen 80;
    server_name aipid.top www.aipid.top;
    return 301 https://$host$request_uri;
}

# ---------- HTTPS 服务器 ----------
server {
    listen 443 ssl;
    http2 on;
    server_name aipid.top www.aipid.top;

    # SSL 证书配置
    ssl_certificate     /etc/nginx/certs/aipid.top.pem;
    ssl_certificate_key /etc/nginx/certs/aipid.top.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 安全头部
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ---------- 静态文件（Vue 构建产物） ----------
    root /usr/share/nginx/html;
    index index.html;

    # Vue 路由 History 模式
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- API 反向代理到 Flask ----------
    location /api/ {
        proxy_pass http://aipid_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        client_max_body_size 16m;
    }

    # ---------- 静态资源缓存 ----------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    access_log /var/log/nginx/aipid_access.log;
    error_log  /var/log/nginx/aipid_error.log;
}
